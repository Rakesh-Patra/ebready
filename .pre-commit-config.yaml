# Choose this OR the native .githooks hook. Both scan the staged snapshot.
repos:
  - repo: local
    hooks:
      - id: private-config-paths
        name: Block private configuration paths
        entry: python scripts/check_staged_secrets.py
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
