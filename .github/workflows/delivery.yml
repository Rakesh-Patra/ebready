name: EBKit CI DevSecOps and OIDC deployment

on:
  push:
    branches: [main, feat/modern-workspace-deployment-improvements]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install and test
        run: |
          python -m pip install '.[dev,database]'
          python -m pytest tests/test_aws_tls.py tests/test_managed_database.py tests/test_cluster_health_poll.py tests/test_controls.py tests/test_production_ops.py -q
          cd web
          npm ci
          EBKIT_TEST_PYTHON="$(command -v python)" npm test -- --pool=threads --maxWorkers=1 --testTimeout=15000
          npm run build
          npm audit --omit=dev --audit-level=high
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.14.9'
      - name: Validate infrastructure without AWS credentials
        run: |
          terraform -chdir=infra/terraform fmt -check
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate
      - name: Build the application image
        run: |
          mkdir -p artifacts
          docker build --label org.opencontainers.image.revision="${{ github.sha }}" -t ebkit:ci .
      - name: Scan source dependencies and secrets
        uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          skip-dirs: web/node_modules,artifacts,infra/terraform/.terraform
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: artifacts/source-security.json
      - name: Scan the image before cloud credentials are requested
        uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0
        with:
          image-ref: ebkit:ci
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: artifacts/image-security.json
      - name: Create software bill of materials
        uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0
        with:
          image-ref: ebkit:ci
          format: cyclonedx
          output: artifacts/sbom.cdx.json
      - name: Save the scanned image
        run: docker save ebkit:ci -o artifacts/image.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-image-${{ github.sha }}
          path: artifacts/image.tar
          retention-days: 1
      - name: Preserve security reports even if a scan fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-reports-${{ github.sha }}
          path: artifacts/*.json
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref_name == vars.DEPLOYMENT_BRANCH
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-image-${{ github.sha }}
          path: artifacts
      - name: Load the already scanned image
        run: |
          docker load -i artifacts/image.tar
          python -m pip install boto3
      - name: Exchange the GitHub OIDC token for short lived AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}
          role-duration-seconds: 3600
          mask-aws-account-id: true
      - name: Publish an immutable image and deploy its digest
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          EB_ARTIFACT_BUCKET: ${{ vars.EB_ARTIFACT_BUCKET }}
          EB_APPLICATION: ${{ vars.EB_APPLICATION }}
          EB_ENVIRONMENT: ${{ vars.EB_ENVIRONMENT }}
        run: |
          REGISTRY="${ECR_REPOSITORY%%/*}"
          TAG="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          docker tag ebkit:ci "$ECR_REPOSITORY:$TAG"
          docker push "$ECR_REPOSITORY:$TAG"
          DIGEST=$(aws ecr describe-images --repository-name "${ECR_REPOSITORY#*/}" --image-ids "imageTag=$TAG" --query 'imageDetails[0].imageDigest' --output text)
          python scripts/release_dashboard.py --image "$ECR_REPOSITORY@$DIGEST"
      - name: Capture deployed screenshots and generate the walkthrough
        run: |
          python -m pip install playwright==1.64.0 markdown==3.7 pypdfium2==4.30.0
          python -m playwright install --with-deps chromium
          python scripts/capture_delivery.py
      - name: Preserve deployment and smoke test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-evidence-${{ github.sha }}
          path: |
            artifacts/release-*.json
            artifacts/devops-document/
          if-no-files-found: ignore
          retention-days: 7
