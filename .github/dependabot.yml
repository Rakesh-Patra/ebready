version: 2

# One routine maintenance PR across ecosystems. Major upgrades need a separate
# compatibility review; dependency alerts and security-update PRs remain enabled.
multi-ecosystem-groups:
  maintenance:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: docker
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: maintenance
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: maintenance
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /web
    patterns: ["*"]
    multi-ecosystem-group: maintenance
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: pip
    # The root updater already discovers security/requirements.txt.
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: maintenance
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
