[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ebkit"
version = "0.1.0"
description = "AI-powered deployment-kit generator for AWS Elastic Beanstalk"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

dependencies = [
    "click>=8.1",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "boto3>=1.40.0",
]

[project.optional-dependencies]
database = ["psycopg[binary]>=3.2"]
openai = ["openai>=1.0"]
google = ["google-genai>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
ebkit = "ebkit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ebkit*"]

[tool.setuptools.package-data]
ebkit = ["generator/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
